name: Terraform

# Every pull request targeting main runs all four jobs — including docs-only
# PRs — because these job names are the required status checks of the branch
# protection policy. A path filter here would let any PR skip a required
# check (tests/ci/test-required-checks.sh guards this).
on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Format and validate (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [infra/bootstrap, infra/platform, infra/frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # PR validation is credential-free: no token is left on the runner.
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - name: Check formatting
        working-directory: ${{ matrix.root }}
        run: terraform fmt -check -recursive
      - name: Initialize without state
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false
      - name: Validate configuration
        working-directory: ${{ matrix.root }}
        run: terraform validate

  ci-scripts:
    name: CI script and workflow checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24.0'
      - name: Run shell fixtures
        run: |
          bash -n scripts/ci/*.sh scripts/oci-free-tier-preflight.sh ops/scripts/* scripts/ops/* tests/ci/*.sh
          tests/ci/run.sh
          jq empty scripts/ci/*-safe-plan-policy.json
      - name: Lint GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          actionlint_dir="$(go env GOBIN)"
          if [[ -z "$actionlint_dir" ]]; then actionlint_dir="$(go env GOPATH)/bin"; fi
          "$actionlint_dir/actionlint"

