name: Terraform

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
      - '.github/workflows/terraform-plan.yml'
      - '.github/workflows/terraform-apply.yml'
      - '.github/workflows/oci-backend-validation.yml'
      - 'scripts/ci/**'
      - 'scripts/acceptance/**'
      - 'tests/ci/**'
      - 'tests/acceptance/**'

permissions:
  contents: read

jobs:
  validate:
    name: Format and validate (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [infra/bootstrap, infra/platform, infra/frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - name: Check formatting
        working-directory: ${{ matrix.root }}
        run: terraform fmt -check -recursive
      - name: Initialize without state
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false
      - name: Validate configuration
        working-directory: ${{ matrix.root }}
        run: terraform validate

  ci-scripts:
    name: CI script and workflow checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24.0'
      - name: Run shell fixtures
        run: |
          bash -n scripts/ci/*.sh scripts/oci-free-tier-preflight.sh ops/scripts/* tests/ci/*.sh
          tests/ci/run.sh
          jq empty scripts/ci/*-safe-plan-policy.json
      - name: Lint GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          actionlint_dir="$(go env GOBIN)"
          if [[ -z "$actionlint_dir" ]]; then actionlint_dir="$(go env GOPATH)/bin"; fi
          "$actionlint_dir/actionlint"

