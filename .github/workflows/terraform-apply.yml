name: Production Terraform apply

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  apply-platform:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: eventforge-production-apply
      cancel-in-progress: false
    env:
      OCI_REGION: ${{ vars.OCI_REGION }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - name: Exchange GitHub identity for OCI RPST
        env:
          OCI_WIF_CONFIG_JSON: ${{ secrets.OCI_WIF_CONFIG_JSON }}
        run: scripts/ci/configure-oci-wif.sh
      - name: Write protected platform inputs
        env:
          TFVARS: ${{ secrets.TF_VARS_PLATFORM }}
        run: |
          test -n "$TFVARS"
          printf '%s' "$TFVARS" > infra/platform/terraform.auto.tfvars
      - name: Initialize locked OCI state backend
        working-directory: infra/platform
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          OCI_OBJECT_STORAGE_NAMESPACE: ${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}
        run: |
          test -n "$TF_STATE_BUCKET" && test -n "$OCI_OBJECT_STORAGE_NAMESPACE"
          cat > backend.hcl <<EOF
          bucket    = "$TF_STATE_BUCKET"
          namespace = "$OCI_OBJECT_STORAGE_NAMESPACE"
          key       = "platform/terraform.tfstate"
          region    = "${OCI_REGION}"
          auth      = "ResourcePrincipal"
          EOF
          terraform init -input=false -backend-config=backend.hcl
      - name: Recreate and enforce reviewed plan
        working-directory: infra/platform
        run: |
          terraform plan -input=false -out=production.tfplan
          terraform show -json production.tfplan > production-plan.json
          ../../scripts/ci/assert-safe-plan.sh --policy ../../scripts/ci/platform-safe-plan-policy.json production-plan.json
      - name: Apply freshly checked plan
        working-directory: infra/platform
        run: terraform apply -input=false production.tfplan
