name: Publish frontend

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: eventforge-production-frontend
      cancel-in-progress: false
    env:
      OCI_REGION: ${{ vars.OCI_REGION }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_release_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@40f1582b2485089dde7abd97c1529aa768e1baff # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - name: Build frontend when application source is available
        shell: bash
        run: |
          if [[ -f frontend/Cargo.toml ]]; then
            cargo install trunk --locked
            trunk build --release --dist infra/frontend/public --filehash false --config frontend/Trunk.toml
          else
            echo 'No frontend Cargo workspace yet; publishing the checked-in placeholder asset.'
          fi
      - name: Configure OCI workload federation
        env:
          OCI_WIF_CONFIG_JSON: ${{ secrets.OCI_WIF_CONFIG_JSON }}
        run: scripts/ci/configure-oci-wif.sh
      - name: Write protected inputs and initialize state
        working-directory: infra/frontend
        env:
          TFVARS: ${{ secrets.TF_VARS_FRONTEND }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          OCI_OBJECT_STORAGE_NAMESPACE: ${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}
        run: |
          test -n "$TFVARS" && test -n "$TF_STATE_BUCKET" && test -n "$OCI_OBJECT_STORAGE_NAMESPACE"
          printf '%s' "$TFVARS" > terraform.auto.tfvars
          cat > backend.hcl <<EOF
          bucket    = "$TF_STATE_BUCKET"
          namespace = "$OCI_OBJECT_STORAGE_NAMESPACE"
          key       = "frontend/terraform.tfstate"
          region    = "${OCI_REGION}"
          auth      = "ResourcePrincipal"
          EOF
          terraform init -input=false -backend-config=backend.hcl
      - name: Create and enforce protected frontend plan
        working-directory: infra/frontend
        run: |
          terraform plan -input=false -out=production.tfplan
          terraform show -json production.tfplan > production-plan.json
          ../../scripts/ci/assert-safe-plan.sh --policy ../../scripts/ci/frontend-safe-plan-policy.json production-plan.json
      - name: Deploy Worker static assets
        working-directory: infra/frontend
        run: terraform apply -input=false production.tfplan

